# Typprüfung, Linter und Tests bei jedem Pull Request.
#
# Bewusst ohne `next build`: Der Build-Befehl dieses Projekts führt
# `prisma migrate deploy` aus und bräuchte eine Datenbank. Das Bauen übernimmt
# Vercel und meldet das Ergebnis als Status an den Pull Request zurück — ein
# gebrochener Build fällt dort auf.
#
# **Dieselbe Prüfung läuft seit dem 29.07.2026 auch im Vercel-Build**
# (`npm run pruefung`, eingehängt in `portal/vercel.json`). Das ist kein
# Versehen und keine Dublette, sondern eine Rückfallebene: Am 29.07. liefen auf
# diesem Repository ab 06:58 Uhr auf **keinem** Branch mehr Workflows — ohne
# Fehlermeldung, sie wurden schlicht nicht mehr gestartet. Ein Pull Request war
# damit nicht mehr prüfbar, und ein grüner Vercel-Deploy sagte nichts über die
# Tests aus. (Die Ursache war später eine andere als zunächst vermutet — ein
# Merge-Konflikt, wegen dessen GitHub keinen Merge-Commit bauen konnte. Die
# Rückfallebene bleibt trotzdem richtig: Sie kostet nichts und deckt auch den
# Fall ab, dass Actions einmal wirklich stillstehen.)
#
# Beide Wege rufen **denselben** Skript-Eintrag auf. Wer die Prüfung ändert,
# ändert sie damit an einer Stelle; zwei Listen von Befehlen liefen sonst
# früher oder später auseinander.
name: Prüfung

on:
  pull_request:
  # Der Standard-Branch dieses Repos heißt nicht `main`. Der frühere Filter
  # `branches: [main]` traf deshalb nichts: Nach einem direkten Push lief keine
  # Prüfung, nur Pull Requests waren abgedeckt.
  push:
    branches: [claude/friendly-archimedes-ggmjhp]

jobs:
  pruefung:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json

      # `npm ci` löst über postinstall `prisma generate` aus – das erzeugt den
      # Client aus dem Schema und braucht keine Datenbankverbindung.
      - name: Abhängigkeiten installieren
        run: npm ci

      # Genau der Befehl, den auch Vercel ausführt.
      - name: Typprüfung, Linter und Tests
        run: npm run pruefung
