<!doctype html>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Plus Jakarta Sans";
    src: url("../../portal/public/fonts/jakarta-800.woff2") format("woff2");
    font-weight: 800;
  }
  @font-face {
    font-family: "Plus Jakarta Sans";
    src: url("../../portal/public/fonts/jakarta-600.woff2") format("woff2");
    font-weight: 600;
  }
  @font-face {
    font-family: "Inter";
    src: url("../../portal/public/fonts/inter-400.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Inter";
    src: url("../../portal/public/fonts/inter-600.woff2") format("woff2");
    font-weight: 600;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; }
  body {
    background: radial-gradient(120% 100% at 50% 0%, #241d18 0%, #1a1512 60%);
    color: #fff;
    font-family: "Inter", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 44px;
  }
  img { width: 420px; }
  h1 {
    font-family: "Plus Jakarta Sans", sans-serif;
    font-weight: 800;
    font-size: 76px;
    letter-spacing: -0.02em;
    text-align: center;
  }
  h1 span { color: #f69018; }
  .sub { font-size: 34px; color: #cfc4bb; text-align: center; }
  .row { display: flex; gap: 18px; margin-top: 8px; }
  .chip {
    border: 1px solid #3a302a;
    background: #241d18;
    color: #e9e0d8;
    border-radius: 999px;
    padding: 14px 30px;
    font-size: 26px;
  }
  .cta {
    margin-top: 20px;
    background: #f69018;
    color: #1a1512;
    font-weight: 600;
    font-size: 34px;
    border-radius: 999px;
    padding: 22px 56px;
  }
  .foot { font-size: 24px; color: #9b8f85; margin-top: 10px; }

  /* ── Auftritt: die Elemente kommen nacheinander, nichts steht still ── */
  img, h1, .sub, .row, .cta, .foot {
    opacity: 0;
    transform: translateY(28px);
    animation: rise .85s cubic-bezier(.2,.7,.2,1) forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  img   { animation-delay: .15s; animation-name: riseLogo; }
  h1    { animation-delay: .55s; }
  .sub  { animation-delay: .85s; }
  .row  { animation-delay: 1.05s; }
  .cta  { animation-delay: 1.3s; animation-name: pop; }
  .foot { animation-delay: 1.6s; }
  @keyframes riseLogo {
    from { opacity: 0; transform: translateY(28px) scale(.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes pop {
    0%   { opacity: 0; transform: translateY(24px) scale(.92); }
    70%  { opacity: 1; transform: translateY(0) scale(1.035); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* Die Chips staffeln sich einzeln ein. */
  .chip { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
  .chip:nth-child(1) { animation-delay: 1.05s; }
  .chip:nth-child(2) { animation-delay: 1.18s; }
  .chip:nth-child(3) { animation-delay: 1.31s; }
  /* Ruhiges Atmen des Hintergrundlichts, damit der Abspann nicht einfriert. */
  body::before {
    content: ""; position: fixed; inset: -10%;
    background: radial-gradient(46% 42% at 50% 34%, #3a2c1f 0%, transparent 70%);
    opacity: .55;
    animation: breathe 9s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: .38; transform: scale(1); }
    50%      { opacity: .62; transform: scale(1.06); }
  }
  /* Der Call-to-Action bekommt einen langsamen Lichtschein. */
  .cta { position: relative; overflow: hidden; }
  .cta::after {
    content: ""; position: absolute; top: 0; left: -60%; width: 45%; height: 100%;
    background: linear-gradient(100deg, transparent, #ffffff88, transparent);
    animation: shine 4.5s ease-in-out 2.2s infinite;
  }
  @keyframes shine { 0% { left: -60%; } 35%, 100% { left: 130%; } }
</style>
<img src="../../portal/public/bw-logo.png" alt="" />
<h1>Hausverwaltung,<br />die <span>transparent</span> ist.</h1>
<div class="sub">Ihr Kundenportal für Eigentümer und Eigentümergemeinschaften</div>
<div class="row">
  <div class="chip">Vorgänge live verfolgen</div>
  <div class="chip">WEG-Finanzen nachvollziehbar</div>
  <div class="chip">Digital abstimmen</div>
</div>
<div class="cta">Zugang anfordern · www.bundwimmobilien.de</div>
<div class="foot">B&amp;W Immobilien Management UG · Gladbeck · Hosting in der EU, DSGVO-konform</div>
